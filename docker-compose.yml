services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    command: sh -c "npm run import && npm run server"
    ports:
      - "3000:3000"
    volumes:
      - sqlite-data:/app/data
      - "./Dataset Evento Congresso 2025.xlsx:/app/Dataset Evento Congresso 2025.xlsx:ro"

  frontend:
    build:
      context: ./client
      dockerfile: Dockerfile
    command: npm run dev -- --host 0.0.0.0
    environment:
      API_PROXY_TARGET: http://backend:3000
    ports:
      - "5173:5173"
    depends_on:
      - backend

volumes:
  sqlite-data:
